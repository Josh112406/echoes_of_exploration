<!DOCTYPE html>
<html lang="en" data-type="software" data-theme="evening" data-radius="sharp" data-buttons="pill">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="page-type" content="software" />
    <meta name="site-kind" content="gaming" />
    <title>Still Out There — Abandoned, but not forgotten</title>
    <link rel="stylesheet" href="./src/ui/system.css" />
  </head>
  <body>
    <div id="app">
      <!-- Fixed Nav Header -->
      <header class="nav">
        <div class="nav-brand">
          <span class="brand-title">STILL OUT THERE</span>
          <span class="brand-separator">//</span>
          <span class="brand-telemetry">NASA HISTORICAL CATALOGUE</span>
        </div>
        <nav class="nav-actions" aria-label="Main Navigation">
          <button id="nav-hub" class="btn btn--nav active">
            <span class="btn-dot"></span>HUB
          </button>
          <button id="nav-archive" class="btn btn--nav">ARCHIVE</button>
          <button id="nav-audio" class="btn btn--nav" aria-label="Toggle Audio">AUDIO: MUTED</button>
          <button id="nav-settings" class="btn btn--nav">SETTINGS</button>
          <button id="nav-about" class="btn btn--nav">ABOUT</button>
        </nav>
      </header>

      <!-- Main Stage -->
      <main id="game-stage">
        <!-- Persistent Phaser Canvas Mount -->
        <div id="game-container"></div>

        <!-- Accessible DOM Overlays -->
        <div id="title-overlay" class="overlay-pane hidden" style="justify-content: center; align-items: center; background: transparent;"></div>
        <div id="hub-overlay" class="overlay-pane hidden"></div>
        <div id="archive-overlay" class="overlay-pane hidden"></div>
        <div id="entry-overlay" class="overlay-pane hidden"></div>
        <div id="failure-overlay" class="overlay-pane hidden" style="justify-content: center; align-items: center; background: rgba(7, 9, 14, 0.85);"></div>
        <div id="settings-overlay" class="overlay-pane hidden" style="justify-content: center; align-items: center; background: rgba(7, 9, 14, 0.85);"></div>
        <div id="about-overlay" class="overlay-pane hidden" style="justify-content: center; align-items: center; background: rgba(7, 9, 14, 0.85);"></div>
      </main>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
