<!DOCTYPE html>
<html lang="en" data-type="software" data-theme="evening" data-radius="sharp" data-buttons="pill">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="page-type" content="software" />
    <meta name="site-kind" content="gaming" />
    <title>Echoes of Exploration — The NASA Signal Archive</title>
    <meta name="description" content="Echoes of Exploration — The NASA Signal Archive. Recover 23 real NASA machines across the Moon, Mars and deep space." />
    <meta property="og:title" content="Echoes of Exploration — The NASA Signal Archive" />
    <meta property="og:description" content="An educational browser game: follow UNIT-7 across the Moon, Mars and deep space to recover the stories of 23 real NASA missions." />
    <meta name="application-name" content="Echoes of Exploration" />
    <link rel="stylesheet" href="./src/ui/system.css" />
  </head>
  <body>
    <div id="app">
      <!-- Main Stage -->
      <main id="game-stage">
        <!-- Persistent Phaser Canvas Mount -->
        <div id="game-container"></div>

        <!-- Accessible DOM Overlays -->
        <div id="title-overlay" class="overlay-pane hidden" style="justify-content: center; align-items: center; background: transparent;"></div>
        <div id="hub-overlay" class="overlay-pane hidden"></div>
        <div id="archive-overlay" class="overlay-pane hidden"></div>
        <div id="entry-overlay" class="overlay-pane hidden"></div>
        <div id="failure-overlay" class="overlay-pane hidden" style="justify-content: center; align-items: center; background: rgba(7, 9, 14, 0.85);"></div>
        <div id="settings-overlay" class="overlay-pane hidden" style="justify-content: center; align-items: center; background: rgba(7, 9, 14, 0.85);"></div>
        <div id="about-overlay" class="overlay-pane hidden" style="justify-content: center; align-items: center; background: rgba(7, 9, 14, 0.85);"></div>
        <div id="fieldtask-overlay" class="overlay-pane hidden" style="justify-content: center; align-items: center; background: rgba(7, 9, 14, 0.9);"></div>
      </main>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
